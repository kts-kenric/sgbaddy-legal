<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Back to SG Baddy</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="inner">
      <div class="brand"><img src="favicon.png" alt="">SG BADDY</div>
    </div>
  </header>
  <main class="state">
    <div class="card">
      <div class="big">🏸</div>
      <h2>Taking you back to the app…</h2>
      <p>If nothing happens, tap the button below.</p>
      <p><a id="open" class="btn" href="sgbaddy://">Open SG Baddy</a></p>
    </div>
  </main>
  <script>
    // Stripe Checkout can only redirect to https, so this page relays the
    // browser into the app. ?to=game/<uuid> (validated) deep-links straight
    // to the game that was just paid for.
    var to = new URLSearchParams(location.search).get('to') || '';
    if (!/^game\/[0-9a-f-]{36}$/.test(to)) to = '';
    var target = 'sgbaddy://' + to;
    document.getElementById('open').setAttribute('href', target);
    location.href = target;
  </script>
</body>
</html>
